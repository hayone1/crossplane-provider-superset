# This example creates a table chart of the sales per region, with the database connection and
# the dataset that the chart needs.
# e2e-update: Chart/sales-by-region {"spec":{"forProvider":{"description":"Sales per region (updated)","cacheTimeout":300}}}
apiVersion: v1
kind: Secret
metadata:
  namespace: default
  name: chart-db-db
type: Opaque
stringData:
  password: examples
---
apiVersion: database.superset.m.crossplane.io/v1alpha1
kind: Database
metadata:
  namespace: default
  name: chart-db
spec:
  forProvider:
    connectionName: Warehouse (chart example)
    dbEngine: postgresql
    dbHost: postgres
    dbPort: 5432
    dbName: examples
    dbUser: examples
    dbPassSecretRef:
      name: chart-db-db
      key: password
    exposeInSqllab: true
    allowRunAsync: false
    allowCtas: false
    allowCvas: false
    allowDml: false
---
apiVersion: dataset.superset.m.crossplane.io/v1alpha1
kind: Dataset
metadata:
  namespace: default
  name: chart-sales
spec:
  forProvider:
    databaseNameRef:
      name: chart-db
    schema: public
    tableName: sales
---
apiVersion: chart.superset.m.crossplane.io/v1alpha1
kind: Chart
metadata:
  namespace: default
  name: sales-by-region
spec:
  forProvider:
    name: Sales by region (example)
    description: Sales per region
    vizType: table
    datasourceIdRef:
      name: chart-sales
    params: |
      {"viz_type": "table", "query_mode": "aggregate", "groupby": ["region"], "metrics": ["count"], "row_limit": 100}
