# The ProviderConfig that cluster-scoped managed resources use when they name no other.
# It reads the credentials from the Secret in secret.yaml.tmpl.
apiVersion: superset.crossplane.io/v1beta1
kind: ProviderConfig
metadata:
  name: default
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: superset-creds
      key: credentials
