# This example creates a saved query of SQL Lab.
# e2e-update: SavedQuery/sales-per-day {"spec":{"forProvider":{"label":"Sales per day (example, renamed)"}}}
apiVersion: v1
kind: Secret
metadata:
  name: query-db-db
  namespace: crossplane-system
type: Opaque
stringData:
  password: examples
---
apiVersion: database.superset.crossplane.io/v1alpha1
kind: Database
metadata:
  name: query-db
spec:
  forProvider:
    connectionName: Warehouse (saved query example)
    dbEngine: postgresql
    dbHost: postgres
    dbPort: 5432
    dbName: examples
    dbUser: examples
    dbPassSecretRef:
      name: query-db-db
      namespace: crossplane-system
      key: password
    exposeInSqllab: true
    allowRunAsync: false
    allowCtas: false
    allowCvas: false
    allowDml: false
---
apiVersion: sqllab.superset.crossplane.io/v1alpha1
kind: SavedQuery
metadata:
  name: sales-per-day
spec:
  forProvider:
    label: Sales per day (example)
    description: The sales of each day
    databaseIdRef:
      name: query-db
    schema: public
    sql: SELECT day, SUM(amount) FROM sales GROUP BY day ORDER BY day
