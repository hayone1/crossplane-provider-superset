# This example syncs the columns of a dataset from its table, as the dataset editor does. The
# sync runs when the provider creates the managed resource, and again whenever triggers changes.
# e2e-update: DatasetRefresh/refresh-sales {"spec":{"forProvider":{"triggers":{"schema":"v2"}}}}
apiVersion: v1
kind: Secret
metadata:
  name: refresh-db-db
  namespace: crossplane-system
type: Opaque
stringData:
  password: examples
---
apiVersion: database.superset.crossplane.io/v1alpha1
kind: Database
metadata:
  name: refresh-db
spec:
  forProvider:
    connectionName: Warehouse (dataset refresh example)
    dbEngine: postgresql
    dbHost: postgres
    dbPort: 5432
    dbName: examples
    dbUser: examples
    dbPassSecretRef:
      name: refresh-db-db
      namespace: crossplane-system
      key: password
    exposeInSqllab: true
    allowRunAsync: false
    allowCtas: false
    allowCvas: false
    allowDml: false
---
apiVersion: dataset.superset.crossplane.io/v1alpha1
kind: Dataset
metadata:
  name: refresh-sales
spec:
  forProvider:
    databaseNameRef:
      name: refresh-db
    schema: public
    tableName: sales
---
apiVersion: dataset.superset.crossplane.io/v1alpha1
kind: DatasetRefresh
metadata:
  name: refresh-sales
spec:
  forProvider:
    datasetIdRef:
      name: refresh-sales
    triggers:
      schema: v1
