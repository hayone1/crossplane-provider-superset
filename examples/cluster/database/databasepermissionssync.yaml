# This example makes Superset 6 refresh the catalog and schema permissions of a database
# connection. The sync runs when the provider creates the managed resource, and again whenever
# triggers changes.
# e2e-update: DatabasePermissionsSync/warehouse-sync {"spec":{"forProvider":{"triggers":{"version":"2"}}}}
apiVersion: v1
kind: Secret
metadata:
  name: sync-db
  namespace: crossplane-system
type: Opaque
stringData:
  password: examples
---
apiVersion: database.superset.crossplane.io/v1alpha1
kind: Database
metadata:
  name: warehouse-sync
spec:
  forProvider:
    connectionName: Warehouse (permission sync example)
    dbEngine: postgresql
    dbHost: postgres
    dbPort: 5432
    dbName: examples
    dbUser: examples
    dbPassSecretRef:
      name: sync-db
      namespace: crossplane-system
      key: password
    exposeInSqllab: true
    allowRunAsync: false
    allowCtas: false
    allowCvas: false
    allowDml: false
---
apiVersion: database.superset.crossplane.io/v1alpha1
kind: DatabasePermissionsSync
metadata:
  name: warehouse-sync
spec:
  forProvider:
    databaseIdRef:
      name: warehouse-sync
    triggers:
      version: "1"
