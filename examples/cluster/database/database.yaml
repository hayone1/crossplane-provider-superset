# This example creates a database connection from its parts. The password comes from a Secret.
# Superset tests the connection when the provider creates or changes it.
# e2e-update: Database/warehouse {"spec":{"forProvider":{"exposeInSqllab":false,"cacheTimeout":120}}}
apiVersion: v1
kind: Secret
metadata:
  name: warehouse-db
  namespace: crossplane-system
type: Opaque
stringData:
  password: examples
---
apiVersion: database.superset.crossplane.io/v1alpha1
kind: Database
metadata:
  name: warehouse
spec:
  forProvider:
    connectionName: Warehouse (database example)
    dbEngine: postgresql
    dbHost: postgres
    dbPort: 5432
    dbName: examples
    dbUser: examples
    dbPassSecretRef:
      name: warehouse-db
      namespace: crossplane-system
      key: password
    exposeInSqllab: true
    allowRunAsync: false
    allowCtas: false
    allowCvas: false
    allowDml: false
