# This example creates a role that users and groups can have. A RolePermissions gives the role
# its permissions.
# e2e-update: Role/analysts {"spec":{"forProvider":{"name":"Analysts (example, renamed)"}}}
apiVersion: security.superset.crossplane.io/v1alpha1
kind: Role
metadata:
  name: analysts
spec:
  forProvider:
    name: Analysts (example)
