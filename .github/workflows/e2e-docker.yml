name: End to End (Superset in Docker)

# Tests every example against a real Apache Superset that runs in Docker
# (test/superset/compose.yaml, make superset.up) next to a kind cluster. The provider runs
# outside the cluster, so it reaches Superset at localhost:8088. The job needs no secrets.
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        scope: [cluster, namespaced]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install kind
        run: go install sigs.k8s.io/kind@v0.33.0

      - name: Start Apache Superset
        run: make superset.up

      - name: Run the examples
        env:
          SUPERSET_HOST: http://localhost:8088
          SUPERSET_USERNAME: admin
          SUPERSET_PASSWORD: admin
          POLL: 15s
          IDLE: 25s
          E2E_LOG: ${{ runner.temp }}/provider.log
        run: |
          mapfile -t manifests < <(find examples/${{ matrix.scope }} -name '*.yaml' ! -path '*/providerconfig/*' | sort)
          if [[ "${{ matrix.scope }}" == namespaced ]]; then manifests+=(test/e2e/getting-started.yaml); fi
          test/e2e/run.sh "${manifests[@]}"

      - name: Upload the provider log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provider-log-${{ matrix.scope }}
          path: ${{ runner.temp }}/provider.log
