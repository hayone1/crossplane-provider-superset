apiVersion: security.superset.crossplane.io/v1alpha1
kind: User
metadata:
  annotations:
    meta.upbound.io/example-id: security/v1alpha1/user
  labels:
    testing.upbound.io/example-name: example_user
  name: example-user
spec:
  forProvider:
    active: true
    email: example.sample@example.com
    firstName: Example
    lastName: Sample
    passwordSecretRef:
      key: example-key
      name: example-secret
      namespace: upbound-system
    rolesRefs:
    - name: example
    - name: example
    username: example.user
