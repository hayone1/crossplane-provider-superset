apiVersion: dashboard.superset.crossplane.io/v1alpha1
kind: Dashboard
metadata:
  annotations:
    meta.upbound.io/example-id: dashboard/v1alpha1/dashboard
  labels:
    testing.upbound.io/example-name: signups
  name: signups
spec:
  forProvider:
    jsonMetadata: |-
      ${jsonencode({
          refresh_frequency = 300
          color_scheme      = "supersetColors"
        })}
    positionJson: |-
      ${jsonencode({
          DASHBOARD_VERSION_KEY = "v2"
          ROOT_ID               = { type = "ROOT", id = "ROOT_ID", children = ["GRID_ID"] }
          GRID_ID               = { type = "GRID", id = "GRID_ID", parents = ["ROOT_ID"], children = ["ROW-1"] }
          "ROW-1" = {
            type     = "ROW"
            id       = "ROW-1"
            parents  = ["ROOT_ID", "GRID_ID"]
            children = ["CHART-1"]
            meta     = { background = "BACKGROUND_TRANSPARENT" }
          }
          "CHART-1" = {
            type     = "CHART"
            id       = "CHART-1"
            parents  = ["ROOT_ID", "GRID_ID", "ROW-1"]
            children = []
            meta     = { chartId = superset_chart.daily_signups.id, width = 6, height = 50 }
          }
        })}
    published: true
    rolesRefs:
    - name: analysts
    slug: signups
    title: Signups
