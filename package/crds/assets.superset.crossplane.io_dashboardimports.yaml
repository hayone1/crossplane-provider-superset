        description: 'DashboardImport is the Schema for the DashboardImports API.
          Imports the dashboards of an export bundle together with the charts, datasets
          and databases they depend on, and imports them again whenever the bundle
          changes. Deleting the managed resource deletes the dashboards only. When
          one export feeds several import resources, delete the dashboard imports
          first, then the chart imports, then the dataset imports: Superset refuses
          to delete a dataset that charts still use. The external name is the hash
          of the imported bundle; the provider sets it.'
