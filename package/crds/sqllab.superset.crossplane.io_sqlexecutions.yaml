          the connection, the schema and the catalog cannot change: to change them,
          delete the managed resource, which runs destroySql when it is set, and create
          a new one. The connection must be exposed in SQL Lab (exposeInSqllab) and
          allow DML (allowDml) for a statement that changes data or structure. Several
          statements separated by ; run in order; the rows a statement returns are
          discarded. To manage an existing object, set the crossplane.io/external-name
          annotation to its numeric ID.'
