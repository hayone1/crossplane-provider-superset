          button of the dataset editor does: Superset adds the columns the source
          gained, removes the ones it lost, updates the type of the ones it has, and
          recreates the count metric when it is missing. Calculated columns and the
          labels of the columns are kept, while groupby and filterable are reset to
          true. The sync runs when the resource is created and again whenever dataset_id
          or triggers change; it is not undone when the managed resource is deleted.
          The external name is the ID of the dataset.'
